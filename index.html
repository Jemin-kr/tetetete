<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="웹 브라우저에서 바로 플레이할 수 있는 1인용 테트리스 게임" />
  <title>테트리스</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1 class="game-title">테트리스</h1>

  <div class="game-container">

    <!-- Left panel: stats -->
    <div class="side-panel">
      <div class="panel-box">
        <h3>점수</h3>
        <div class="stat-row">
          <div class="stat-value" id="score">0</div>
        </div>
      </div>
      <div class="panel-box">
        <h3>레벨</h3>
        <div class="stat-row">
          <div class="stat-value" id="level">1</div>
        </div>
      </div>
      <div class="panel-box">
        <h3>제거한 줄</h3>
        <div class="stat-row">
          <div class="stat-value" id="lines">0</div>
        </div>
      </div>
    </div>

    <!-- Board -->
    <div class="board-wrapper" id="board-wrapper">
      <canvas id="game-board"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">게임 오버</h2>
        <p id="overlay-score"></p>
      </div>
    </div>

    <!-- Right panel: next, buttons, controls -->
    <div class="side-panel">
      <div class="panel-box">
        <h3>다음 블록</h3>
        <canvas id="next-canvas" width="120" height="120"></canvas>
      </div>
      <div class="panel-box btn-group">
        <button class="btn btn-pause" id="btn-pause">일시정지</button>
        <button class="btn btn-restart" id="btn-restart">다시 시작</button>
      </div>
      <div class="panel-box">
        <h3>조작법</h3>
        <div class="controls-guide">
          <kbd>←</kbd> <kbd>→</kbd> 좌우 이동<br/>
          <kbd>↓</kbd> 소프트 드롭<br/>
          <kbd>X</kbd> 회전<br/>
          <kbd>Z</kbd> 하드 드롭
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
